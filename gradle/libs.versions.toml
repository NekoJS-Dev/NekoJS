# NekoJS 共享版本目录：被多个模块复用、且应当统一的依赖坐标集中在这里，
# 构建脚本通过 `libs.xxx` 访问器引用。
#
# 刻意不纳入的两类：
#   - 各版本节点的 MC / NeoForge / loader 版本 —— 住在 versions/<node>/gradle.properties
#     的 deps.* 键，按节点取值。
#   - curse.maven 的 JEI 等模组坐标 —— 每个 MC 版本是不同的 artifact，无复用价值。
#
# JUnit 有两条版本线，是刻意的：引擎模块（common / common-api-processor）走 BOM 6.0.0，
# MC 节点走 5.14.3，因为 NeoForge 测试环境目前只兼容 JUnit 5。别把它们统一掉。

[versions]
lombok = "1.18.44"
jetbrainsAnnotations = "24.1.0"
jspecify = "1.0.0"
nightConfig = "3.8.3"
gson = "2.11.0"
slf4jModern = "2.0.13"
log4j = "2.20.0"
icu4j = "77.1"
junitBom = "6.0.0"               # 引擎模块（common / common-api-processor）
junitLegacy = "5.14.3"           # MC 节点：NeoForge 测试环境只兼容 JUnit 5
graal = "8762962"                # curse.maven 文件 id = GraalMC 25.1.3.7（NeoForge 构建；fabric=8762963）
                                 # 不可降级：正则求值要求 GraalMC 自带 TRegex 语言 provider 注册，
                                 # 25.1.3.7 之前的构建缺这行注册，脚本用正则会抛
                                 # "No language for id regex found"。
                                 # 同理不要重新引入自带的 provider 补丁类：两份注册会让 Truffle
                                 # 按 id 查重时抛 "Duplicate language id regex"。
moddev = "2.0.140"               # 与 buildSrc/build.gradle.kts 的 ModDevGradle classpath 版本保持一致

# foojay-resolver 的版本硬编码在 settings.gradle.kts：settings 的 plugins{} 块在版本目录
# 绑定之前求值，那里用不了 `alias(libs.plugins.xxx)`。

[libraries]
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrainsAnnotations" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
night-config-core = { module = "com.electronwill.night-config:core", version.ref = "nightConfig" }
night-config-toml = { module = "com.electronwill.night-config:toml", version.ref = "nightConfig" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4jModern" }
log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
icu4j = { module = "com.ibm.icu:icu4j", version.ref = "icu4j" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junitBom" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }      # 版本由 BOM 决定
junit-jupiter-legacy = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junitLegacy" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
graal = { module = "curse.maven:graal-1504336", version.ref = "graal" }
