// NekoJS NeoForge 平台公共构建逻辑（convention via apply script）。
//
// 消费方（platforms/neoforge-1.21.1 / 26.1 / 26.2）需：
//   1. plugins {} 中 apply: java-library, maven-publish, idea,
//      net.neoforged.moddev, me.shedaniel.unified-publishing
//   2. ext 中提供: minecraft_version, ENV
//      (mod_id / mod_name / mod_version / mod_group_id 来自根 gradle.properties)
//   3. apply from: rootProject.file('gradle/neoforge-common.gradle')
//   4. 若平台在 neoForge.mods."${mod_id}" 中把 :common / :common-api 的 main source set
//      注册为 ModDev mod source set（开发运行需要共享类可见），必须在 ext 声明
//      register_shared_dev_mod_source_sets = true，以启用 verifyDevModSourceSets 门禁。
//      当前三个 NeoForge 平台（1.21.1 / 26.1 / 26.2）均注册共享 source set 并启用门禁；
//      不注册共享 source set 的平台不要声明该属性。
//
// 用 apply script 而非 buildSrc convention plugin：第三方插件 (moddev / unified-publishing)
// 的 plugin marker 坐标随版本漂移，在 buildSrc 内硬编码 implementation 依赖会成为额外维护点；
// apply script 让插件版本继续由各平台 plugins{} 声明，只下沉真正稳定、字节级相同的配置块。
// 版本相关与有平台差异的部分（runs / sourceSets / accessTransformers / generateModMetadata /
// dependencies）仍由各平台 build.gradle 本地维护。

def modId      = project.mod_id
def modName    = project.mod_name
def modVersion = project.mod_version
def mcVersion  = project.minecraft_version   // ext property set by consumer
def ENV        = project.ENV                  // ext property set by consumer
def embeddedCommonRuntime = files({
    project(':common').configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts
            .findAll { artifact ->
                !(artifact.moduleVersion.id.group == 'curse.maven' && artifact.name == 'graal-1504336')
            }
            .collect { artifact -> artifact.file }
})

base {
    archivesName = "${modId}-neoforge-${mcVersion}"
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven { url "https://cursemaven.com" }
        }
        filter { includeGroup "curse.maven" }
    }
}

tasks.withType(Jar).configureEach {
    archiveBaseName.set("${modId}-neoforge")
    archiveVersion.set("${mcVersion}-${modVersion}")
}

tasks.named('jar', Jar).configure {
    dependsOn project(':common').tasks.named('jar')
    dependsOn project(':common-api').tasks.named('jar')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'module-info.class'
    exclude 'META-INF/versions/**/module-info.class'
    from project(':common').sourceSets.main.output
    from project(':common-api').sourceSets.main.output
    from {
        embeddedCommonRuntime.collect { dependency ->
            dependency.isDirectory() ? dependency : zipTree(dependency)
        }
    }
}

// 可分发 jar 运行时内容校验下沉到 gradle/verify-runtime-artifact.gradle（apply script
// 参数化，与 platforms/cleanroom-1.12.2/build.gradle 共用同一份逻辑，仅注入平台参数）。
ext.verifyArtifactDescription = 'Verifies that the distributable jar contains runtime and common API classes.'
ext.verifyJarTaskName = 'jar'
ext.verifyArtifactFile = { tasks.named('jar', Jar).get().archiveFile.get().asFile }
ext.verifyPlatformCodecClass = 'com/tkisor/nekojs/platform/nbt/NeoForgeNbtBinaryCodec.class'
ext.verifyEmbeddedCommonRuntime = embeddedCommonRuntime
ext.verifyNeoForgeOnlyChecks = true
apply from: rootProject.file('gradle/verify-runtime-artifact.gradle')

def sharedDevModSourceSetsEnabled = (project.findProperty('register_shared_dev_mod_source_sets') as Boolean) == true
def verifyDevModSourceSets = sharedDevModSourceSetsEnabled ? tasks.register('verifyDevModSourceSets') {
    group = 'verification'
    description = 'Verifies opted-in NeoForge ModDev mod source-set registration.'
    dependsOn tasks.named('classes')
    dependsOn project(':common').tasks.named('classes')
    dependsOn project(':common-api').tasks.named('classes')

    doLast {
        def configuredMod = neoForge.mods.findByName(modId)
        if (configuredMod == null) {
            throw new GradleException("ModDev model for ${project.path} does not define a mod named '${modId}'.")
        }

        def configuredSourceSets = configuredMod.modSourceSets.get()
        def requiredSourceSets = [
                [project: project, sourceSet: sourceSets.main],
                [project: project(':common'), sourceSet: project(':common').sourceSets.main],
                [project: project(':common-api'), sourceSet: project(':common-api').sourceSets.main]
        ]
        requiredSourceSets.each { required ->
            if (!configuredSourceSets.contains(required.sourceSet)) {
                throw new GradleException(
                        "ModDev model for mod '${modId}' in ${project.path} does not include "
                                + "${required.project.path} source set '${required.sourceSet.name}'.")
            }
        }

        def requiredClasses = [
                [project: project, sourceSet: sourceSets.main, classPath: 'com/tkisor/nekojs/NekoJSMod.class'],
                [project: project(':common'), sourceSet: project(':common').sourceSets.main, classPath: 'com/tkisor/nekojs/NekoJS.class'],
                [project: project(':common-api'), sourceSet: project(':common-api').sourceSets.main, classPath: 'com/tkisor/nekojs/api/data/NekoId.class']
        ]
        requiredClasses.each { required ->
            def classFileExists = required.sourceSet.output.classesDirs.files.any { outputDirectory ->
                new File(outputDirectory, required.classPath).isFile()
            }
            if (!classFileExists) {
                throw new GradleException(
                        "${required.project.path} source set '${required.sourceSet.name}' is missing "
                                + "compiled class '${required.classPath}'.")
            }
        }
    }
} : null

tasks.named('check').configure {
    dependsOn tasks.named('verifyRuntimeArtifact')
    if (verifyDevModSourceSets != null) {
        dependsOn verifyDevModSourceSets
    }
}

tasks.register('nbtSmokeTest', Test) {
    group = 'verification'
    description = 'Runs the native NeoForge portable binary NBT smoke tests.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'nbt-smoke'
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

unifiedPublishing {
    project {
        displayName = "${modName} NeoForge ${mcVersion}-${modVersion}"
        releaseType = ENV.RELEASE_TYPE ?: "release"
        gameVersions = [mcVersion]
        gameLoaders = ["neoforge"]

        mainPublication project.tasks.jar

        changelog = ENV.CHANGELOG ?: "A new update for ${modName}!"

        relations {
            depends {
                curseforge = "graal"
            }
        }

        // CurseForge 发布（需要环境变量 CURSEFORGE_KEY 与 gradle.properties 的 curseforge_id）
        if (ENV.CURSEFORGE_KEY) {
            curseforge {
                token = ENV.CURSEFORGE_KEY
                id = project.curseforge_id
            }
        }

        // Modrinth 发布（需要环境变量 MODRINTH_TOKEN 与 gradle.properties 的 modrinth_id）
        if (ENV.MODRINTH_TOKEN) {
            modrinth {
                token = ENV.MODRINTH_TOKEN
                id = project.modrinth_id
                version = "${mcVersion}-${modVersion}"
            }
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
