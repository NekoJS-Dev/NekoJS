# 启动器/daemon JVM 需 17+（推荐 25）。本仓库不再钉本机路径：本机用户应在**用户级**
# ~/.gradle/gradle.properties（Windows 为 C:\Users\<你>\.gradle\gradle.properties）设置
# org.gradle.java.home，或设置 JAVA_HOME。注意优先级：命令行 -D > 用户级 > 项目级——
# 用户级条目会作用于该用户全部 Gradle 构建，个别项目要差异化时改用命令行参数或
# gradle/daemon-jvm.properties（daemon JVM criteria），不要指望项目级覆盖用户级；
# CI 不需要任何配置，由 actions/setup-java 提供 JDK。
# toolchain（编译用 JDK，见各节点 deps.java）由 foojay resolver 供给，与此处无关。
