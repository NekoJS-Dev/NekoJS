pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal(
        )
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url "https://maven.creeperhost.net/" }

        maven {
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            url = 'https://maven.wagyourtail.xyz/releases'
        }
        maven {
            url = 'https://maven.arcseekers.com/releases'
        }

        maven {
            url = 'https://maven.wagyourtail.xyz/snapshots'
        }
    }
}

plugins {
    // Note: foojay-resolver is a settings-plugin and cannot use `alias(libs.plugins.xxx)`
    // because the version catalog is not yet bound when the settings plugins{} block evaluates.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'NekoJS'
include 'common-api'
include 'common-api-processor'
include 'common'

// 嵌套在 platforms 文件夹里的模块，用冒号分隔
include 'platforms:neoforge-26.1'
include 'platforms:neoforge-26.2'
include 'platforms:neoforge-1.21.1'
include 'platforms:cleanroom-1.12.2'