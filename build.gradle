plugins {
    id 'java'
}

group = 'com.tkisor'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    repositories {
        exclusiveContent {
            forRepository {
                maven {
                    url "https://cursemaven.com"
                }
            }
            filter {
                includeGroup "curse.maven"
            }
        }
    }
}

tasks.register('nbtSmokeTest') {
    group = 'verification'
    description = 'Runs portable binary NBT smoke tests across common and every supported platform.'
    dependsOn(
            ':common:nbtSmokeTest',
            ':platforms:neoforge-1.21.1:nbtSmokeTest',
            ':platforms:neoforge-26.1:nbtSmokeTest',
            ':platforms:neoforge-26.2:nbtSmokeTest',
            ':platforms:cleanroom-1.12.2:nbtSmokeTest')
}
