# 每行一条 `Java正则=替换串`（在第一个 '=' 处切分，按文件顺序应用）。
# 与 scripts/check-platform-drift 的 normalize() 主对规则互为反向：漂移脚本把
# 两侧收敛到 26.x 记号，本文件把 26.x master 生成回 1.21.1 记号。
