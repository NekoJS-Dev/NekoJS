# 应用本规则集后的产物与删除前的 1.21.1 手维护副本逐字节一致。
# 权限判断惯用法（hasPermissions(2) vs Commands.LEVEL_GAMEMASTERS.check(...)）
# 形状不同、无法机械往返，不设规则——用到它的文件属于 drifted，不参与生成。
\.identifier\(\)=.location()
\bIdentifier\b=ResourceLocation
