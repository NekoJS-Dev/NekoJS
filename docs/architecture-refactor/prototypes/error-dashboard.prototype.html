<body class="layout-A">
<div class="scene" aria-hidden="true"></div>
<main class="app" id="panel" aria-label="NekoJS 报错面板">
<header class="top">
<div class="mark" aria-hidden="true">!</div><div><div class="brand">NEKOJS / ERROR SNAPSHOT</div><h1>脚本错误</h1></div>
<div class="top-right"><div class="totals"><strong id="total">0</strong>条错误 · 累计 <span id="occurrences">0</span> 次</div></div>
</header>


<div class="workspace" id="workspace">
<aside class="list-pane" id="sidebar" aria-label="错误列表">
<div class="pane-title"><span class="sidebar-label">错误列表 <span id="resultCount" role="status" aria-live="polite"></span></span><button type="button" id="toggleSidebar" aria-expanded="true" aria-controls="sidebarContents" aria-label="收起错误列表" title="收起错误列表">‹</button></div>
<div class="sidebar-contents" id="sidebarContents"><div class="sidebar-search"><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" aria-label="搜索路径、消息、错误 ID 或原始详情" aria-keyshortcuts="/" placeholder="搜索路径、消息、ID 或原始详情…" autocomplete="off"></label><button type="button" id="clearSearch" disabled>清空搜索</button></div><div class="error-list" id="list"></div></div>
</aside>
<section class="detail-frame" aria-label="当前错误">
<header class="detail-head" id="detailHead"></header>

</section>
</div>

<span class="shortcut-hint">/ 搜索 · Esc 关闭</span>
</footer>
</main>
<aside class="prototype-controls" id="sampleToolbar" aria-label="原型控制，不属于游戏内界面">

<select id="scenario" aria-label="演示数据场景"><option value="normal">演示：错误列表</option><option value="long">演示：长消息与长路径</option><option value="missing">演示：缺少源码摘录</option><option value="empty">演示：空列表</option></select>

<dialog id="locateDialog" aria-labelledby="locateTitle"><h2 id="locateTitle">VS Code 定位演示</h2><p id="locateTarget" class="path"></p><p>示例，实际需本地存在路径。报告相对路径不等于本机绝对路径，原生实现待安全解析；远端、未知和虚拟位置不能直接映射成本地文件。</p><p>只使用已有行号，不猜列号，不启动外部程序。</p><div class="dialog-actions"><button type="button" id="closeLocate">知道了</button></div></dialog>
<dialog id="copyDialog" aria-labelledby="copyTitle"><h2 id="copyTitle">手动复制</h2><p id="copyReason">浏览器未允许自动复制。以下内容只读，请全选后复制。</p><textarea id="copyText" readonly spellcheck="false" aria-label="待复制的只读内容"></textarea><div class="copy-actions"><button type="button" id="selectCopy">全选文本</button><button type="button" id="closeCopy">关闭</button></div></dialog>
<noscript><p class="noscript">此交互样例需要启用 JavaScript；不连接游戏，不加载外部资源。</p></noscript>

<script>
'use strict';
const $ = id => document.getElementById(id);
const node = (tag, text, cls) => {
  const e = document.createElement(tag);
  if (text !== undefined) e.textContent = text;
  if (cls) e.className = cls;
  return e;
};
const normal = [
  {id:'nekojs:server/events/player_tick.js',path:'server_scripts/events/player_tick.js',line:42,count:3,message:"TypeError: Cannot read properties of null (reading 'id')",fullDetails:"环境: SERVER\n脚本: server_scripts/events/player_tick.js\n频次: 连续发生了 3 次\n\n>> 异常代码片段 (行 42, 列 11):\n > 42 | const playerId = event.player.id\n     |           ^\n\nTypeError: Cannot read properties of null (reading 'id')\n    at onPlayerTick (server_scripts/events/player_tick.js:42)\n"},
  {id:'nekojs:server/commands/example.js',path:'server_scripts/commands/example.js',line:18,count:1,message:"SyntaxError: Unexpected token '}'",fullDetails:"环境: SERVER\n脚本: server_scripts/commands/example.js\n\n>> 异常代码片段 (行 18, 列 1):\n > 18 | }\n     | ^\n\nSyntaxError: Unexpected token '}'\n"},
  {id:'nekojs:rt/SERVER/timer/1a2b3c',path:'timer/1a2b3c',line:-1,count:7,message:'ReferenceError: missingBinding is not defined',fullDetails:'环境: SERVER\n脚本: timer/1a2b3c\n频次: 连续发生了 7 次\n\nReferenceError: missingBinding is not defined\n    at <anonymous> (Unknown Source)\n'}
];
let data = normal, selected = normal[0].id;
const lineText = e => e.line > 0 ? '行 '+e.line : '行号未知';
const visibleRows = () => {
  const q = $('search').value.trim().toLocaleLowerCase();
  return data.filter(e => [e.id,e.path,e.message,e.fullDetails].some(v => v.toLocaleLowerCase().includes(q)));
};
let showDetail;
function render() {
  const rows = visibleRows();
  if (!rows.some(e => e.id === selected)) selected = rows[0]?.id || null;
  $('total').textContent = data.length;
  $('occurrences').textContent = data.reduce((n,e) => n+e.count,0);
  $('resultCount').textContent = rows.length+' / '+data.length;
  $('clearSearch').disabled = !$('search').value;
  $('list').replaceChildren();
  rows.forEach(e => {
    const b = node('button',undefined,'error-item'+(e.id===selected?' active':''));
    b.title=e.path+'\n'+e.message; b.dataset.errorId=e.id;
    b.type='button'; b.setAttribute('aria-pressed',String(e.id===selected));
    const meta=node('div',undefined,'item-line');meta.append(node('span',lineText(e)),node('span',e.count+' 次','repeat-count'));
    b.append(node('div',e.path,'file-name'),node('div',e.message,'preview'),meta);
    b.onclick=()=>{selected=e.id;render();}; $('list').append(b);
  });
  $('detail').hidden=!rows.length; $('empty').hidden=!!rows.length;
  $('empty').replaceChildren(node('h2',data.length?'没有匹配的错误':'此快照没有错误'),node('p',data.length?'修改或清空搜索条件。':'空列表不代表脚本已经通过检查。'));
  const e=rows.find(e=>e.id===selected);
  if(e) showDetail(e); else $('detail').replaceChildren();
  if($('detailHead')) $('detailHead').hidden=!e;
  if(!rows.length && data.length){const b=node('button','清空搜索');b.type='button';b.onclick=()=>$('clearSearch').click();$('empty').append(b);}
  $('status').textContent=rows.length?'只读快照 · 逻辑服务端 · 未读取脚本文件':(data.length?'没有匹配的错误 · 可调整搜索':'此快照没有错误 · 未读取脚本文件');
}
</script>
<script>
// Local fixtures only. Every error retains exactly the six wire fields.
const longPath='server_scripts/'+('very_long_directory_name/').repeat(12)+'超长脚本名称.js';
const longMessage='Error: '+('这是一段用于检查换行与滚动的长消息。').repeat(32);
const scenarios={normal,empty:[],missing:[{...normal[2],path:'Unknown location',fullDetails:'环境: SERVER\n脚本: Unknown location\n\nReferenceError: missingBinding is not defined\n    at <anonymous> (Unknown Source)\n'}],long:[{id:'nekojs:server/long-example.js',path:longPath,line:128,count:12,message:longMessage,fullDetails:'环境: SERVER\n脚本: '+longPath+'\n\n'+longMessage+'\n'+Array.from({length:60},(_,i)=>'    at callback'+i+' ('+longPath+':128)').join('\n')}]};
$('search').addEventListener('input',()=>render());
$('clearSearch').onclick=()=>{$('search').value='';render();$('search').focus();};
$('scenario').onchange=()=>{data=scenarios[$('scenario').value] || normal;selected=data[0]?.id || null;$('search').value='';render();};
</script>
<script>
// This whitelist identifies fixture examples, NOT verified local files.
const examplePaths=new Set([normal[0].path,normal[1].path,longPath]);
function canLocate(e){return examplePaths.has(e.path) && Number.isInteger(e.line) && e.line>0;}
function showLocationPlan(e){
  if(!canLocate(e)){$('status').textContent='路径或行号未知，无法定位';return;}
  $('locateTarget').textContent='演示：将在 VS Code 定位 '+e.path+':'+e.line;
  $('locateDialog').showModal();$('closeLocate').focus();
  $('status').textContent='已显示定位计划 · 未启动 VS Code';
}
$('closeLocate').onclick=()=>$('locateDialog').close();
async function copyText(text,label){
  try{
    if(!navigator.clipboard?.writeText) throw new Error('Clipboard unavailable');
    await navigator.clipboard.writeText(text);
    $('status').textContent='已复制'+label;
  }catch{
    if(!panelState.open)return;
    $('copyText').value=text;
    $('copyTitle').textContent='手动复制'+label;
    $('copyDialog').showModal();$('copyText').focus();$('copyText').select();
    $('status').textContent='未自动复制；请在只读文本框中手动复制';
  }
}
$('copyText').rows=10; $('copyText').cols=48;
$('selectCopy').onclick=()=>{$('copyText').focus();$('copyText').select();};
$('closeCopy').onclick=()=>$('copyDialog').close();
showDetail=function(e){
  const root=$('detail');root.replaceChildren();
  const head=$('detailHead');head.replaceChildren();
  const title=node('div',undefined,'detail-title');
  title.append(node('div','错误详情 · 只读','eyebrow'),node('h2',e.path.split('/').pop()));
  const actions=node('div',undefined,'detail-actions');
  for(const [label,value] of [['复制路径',e.path],['复制全文',e.fullDetails]]){
    const b=node('button',label);b.type='button';b.onclick=()=>copyText(value,label==='复制路径'?'路径':'原始全文');actions.append(b);
  }
  const locate=node('button','在 VS Code 中打开');
  locate.type='button';locate.id='openInVSCode';locate.disabled=!canLocate(e);
  locate.title=canLocate(e)?'查看定位计划（不启动 VS Code）':'路径或行号未知，无法定位';
  locate.onclick=()=>showLocationPlan(e);actions.append(locate);
  head.append(title,actions);
  const meta=node('div',undefined,'metadata');
  meta.append(node('span',lineText(e)),node('span',e.count+' 次'));
  const id=node('p','ID: '+e.id,'path');
  root.append(node('p',e.path,'path'),meta,id,node('div',e.message,'message'));
  if(!canLocate(e))root.append(node('p','路径或行号未知，无法定位。','detail-note'));
  const hasSource=e.fullDetails.includes('>> 异常代码片段');
  root.append(node('p',hasSource?'仅展示快照中的源码摘录。':'快照未识别到源码摘录，不读取脚本。','detail-note'));
  const stack=e.fullDetails.search(/^[\t ]+at[\t ]+/m);
  const raw=node('details');raw.open=true;
  raw.append(node('summary','原始详情 · fullDetails'),node('pre',stack<0?e.fullDetails:e.fullDetails.slice(0,stack)));
  root.append(raw);
  if(stack>=0){
    const folded=node('details');folded.append(node('summary','调用栈及后续原始文本 · 点击展开'),node('pre',e.fullDetails.slice(stack)));root.append(folded);
  }
  root.append(node('p','文本折叠不改变复制全文。','detail-note'));
  root.scrollTop=0;
};
</script>
<script>
// A is the only layout. View state never changes the six-field error snapshots.
const panelState={open:true,sidebarCollapsed:false};
function syncPanel(){
  $('panel').hidden=!panelState.open;
  $('reopenPanel').disabled=panelState.open;
  $('panel').classList.toggle('is-sidebar-collapsed',panelState.sidebarCollapsed);
  $('sidebarContents').hidden=panelState.sidebarCollapsed;
  const toggle=$('toggleSidebar');
  toggle.textContent=panelState.sidebarCollapsed?'›':'‹';
  toggle.setAttribute('aria-expanded',String(!panelState.sidebarCollapsed));
  toggle.setAttribute('aria-label',panelState.sidebarCollapsed?'展开错误列表':'收起错误列表');
  toggle.title=panelState.sidebarCollapsed?'展开错误列表':'收起错误列表';
}
function hidePanel(){
  document.querySelectorAll('dialog[open]').forEach(d=>d.close());
  panelState.open=false;syncPanel();$('reopenPanel').focus();
}
$('toggleSidebar').onclick=()=>{
  panelState.sidebarCollapsed=!panelState.sidebarCollapsed;syncPanel();
};
$('reopenPanel').onclick=()=>{panelState.open=true;syncPanel();$('toggleSidebar').focus();};
document.addEventListener('keydown',event=>{
  if(event.isComposing)return;
  if(event.key==='Escape'){
    const modal=document.querySelector('dialog[open]');
    if(modal){event.preventDefault();event.stopPropagation();modal.close();return;}
    if(!panelState.open)return;
    event.preventDefault();event.stopPropagation();hidePanel();return;
  }
  if(event.defaultPrevented || event.ctrlKey || event.altKey || event.metaKey || !panelState.open || document.querySelector('dialog[open]'))return;
  if(event.target.closest('input,textarea,select,[contenteditable]'))return;
  if(event.key==='/'){
    event.preventDefault();panelState.sidebarCollapsed=false;syncPanel();$('search').focus();
  }
},true);
syncPanel();
render();
</script>
</body>
</html>
