gradle.projectsEvaluated {
    def common = rootProject.findProject(':common')
    if (common == null) return
    def auditDir = new File(System.getenv('TEMP'), 'nekojs-pr61-ec7fe684-audit')
    common.tasks.register('compilePr61Audit', JavaCompile) {
        dependsOn common.tasks.named('testClasses')
        source = common.fileTree(auditDir) { include '*.java' }
        classpath = common.sourceSets.test.runtimeClasspath + common.sourceSets.test.compileClasspath
        destinationDirectory = new File(auditDir, 'classes')
        options.encoding = 'UTF-8'
        javaCompiler = common.javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
    }
    common.tasks.register('runPr61Audit', JavaExec) {
        dependsOn common.tasks.named('compilePr61Audit')
        classpath = common.files(new File(auditDir, 'classes')) + common.sourceSets.test.runtimeClasspath
        mainClass = 'com.tkisor.nekojs.core.compiler.Pr61AuditRunner'
        systemProperty 'polyglot.engine.WarnInterpreterOnly', 'false'
    }
}