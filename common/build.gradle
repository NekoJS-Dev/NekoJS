plugins {
    id 'java-library'
    id 'idea'
}

version = mod_version
group = mod_group_id


repositories {
    mavenCentral()

    maven {
        url "https://maven.neoforged.net/releases"
    }

    exclusiveContent {
        forRepository {
            maven {
                url "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main {
    resources {
        srcDir "src/main/templates"
        filter {
            it.replace('${mod_version}', mod_version)
        }
    }
}

dependencies {
    api project(':common-api')

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testImplementation libs.gson
    testRuntimeOnly libs.junit.platform.launcher
    // 25.1.3.6; exported so every platform receives the same remapper SPI.
    api(libs.graal)

    compileOnly libs.jspecify
    compileOnly libs.gson
    compileOnly libs.slf4j.api
    compileOnly libs.log4j.api
    compileOnly libs.log4j.core
    compileOnly libs.jetbrains.annotations
    compileOnly libs.night.config.core
    compileOnly libs.night.config.toml
    compileOnly libs.lombok
    annotationProcessor libs.lombok

    // 测试运行时 stub：compiler/probe 链上的类引用 gson/log4j 等，游戏内由 MC/NeoForge 提供，
    // 但 common 独立测试时需要在 testRuntimeOnly 提供这些实现，否则 NoClassDefFoundError。
    testRuntimeOnly libs.slf4j.api
    testRuntimeOnly libs.log4j.api
    testRuntimeOnly libs.log4j.core
    testRuntimeOnly libs.icu4j

}

test {
    useJUnitPlatform()
}

tasks.register('nbtSmokeTest', Test) {
    group = 'verification'
    description = 'Runs managed API and sandboxed filesystem smoke tests for portable binary NBT.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'nbt-smoke'
    }
}
