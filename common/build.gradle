// 引擎模块：MC / Loader 无关的纯 Java 21 主体，五个节点共用。com.tkisor.nekojs.api.* 是对外
// 契约包（零 MC/Loader import，由 guardLint 按包前缀强制，ADR-0007）；其余包是引擎实现。
// Graal 不是禁止项：common（含 api.*）允许直接依赖 GraalJS —— "契约层零 Graal import"
// 已按票 33（2026-09-19）移除。
// 不发布 Maven 制品，产物由各节点内嵌进平台 fat jar。

plugins {
    id 'java-library'
    id 'idea'
}

version = mod_version
group = mod_group_id


repositories {
    mavenCentral()

    maven {
        url "https://maven.neoforged.net/releases"
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // 保留参数名：ContractReflector 反射读 facade 方法的参数名（Text.of(String text) → "text"）
    options.compilerArgs += '-parameters'
}

sourceSets.main {
    resources {
        srcDir "src/main/templates"
    }
}

processResources {
    // 模板变量替换：sourceSets.main.resources.filter{} 不会作用于 processResources 的
    // CopySpec（实测不生效），需在任务级显式声明（api-runtime.properties 的 nekojs.version）
    filesMatching('nekojs/api-runtime.properties') {
        filter { it.replace('${mod_version}', mod_version) }
    }
}

dependencies {
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testImplementation libs.gson
    testImplementation libs.asm
    testRuntimeOnly libs.junit.platform.launcher
    // Export the Graal API and remapper SPI; platform nodes select their loader build.
    api(libs.graal)

    compileOnly libs.jspecify
    // Used by declaration preparation and offline artifact generation, never callback dispatch.
    compileOnly libs.asm
    compileOnly libs.gson
    compileOnly libs.slf4j.api
    compileOnly libs.log4j.api
    compileOnly libs.log4j.core
    compileOnly libs.jetbrains.annotations
    compileOnly libs.night.config.core
    compileOnly libs.night.config.toml
    compileOnly libs.lombok
    annotationProcessor libs.lombok

    // 测试运行时 stub：compiler/probe 链上的类引用 gson/log4j 等，游戏内由 MC/NeoForge 提供，
    // 但 common 独立测试时需要在 testRuntimeOnly 提供这些实现，否则 NoClassDefFoundError。
    testRuntimeOnly libs.slf4j.api
    testRuntimeOnly libs.log4j.api
    testRuntimeOnly libs.log4j.core
    // Exercise production SLF4J diagnostics in standalone tests instead of a NOP logger.
    testRuntimeOnly libs.log4j.slf4j2.impl
    testRuntimeOnly libs.icu4j
    // night-config：ProbeConfigLoader（probe.toml 读写）依赖；游戏内由平台提供，独立测试需注入
    testRuntimeOnly libs.night.config.core
    testRuntimeOnly libs.night.config.toml

}

test {
    useJUnitPlatform()
    // 主仓根 build.gradle allprojects 的 Test 约定（golden 对比对 locale 敏感）
    systemProperty 'user.language', 'en'
    systemProperty 'user.country', 'US'
    systemProperty 'user.timezone', 'UTC'
    systemProperty 'file.encoding', 'UTF-8'
    // 透传 golden 再生成开关：`-Dnekojs.golden.regenerate=true`（ApiManifestGoldenTest 等
    // golden 测试写回基线后跳过断言；与 :common:regenerateGoldens 的 probe golden 模式一致）
    systemProperty 'nekojs.golden.regenerate', System.getProperty('nekojs.golden.regenerate', 'false')

    // These fixtures feed the npm Probe checks. Cache them with the test results so a cache hit
    // restores declarations and consumers, not just reports. Add new build/probe-ts-* roots here.
    outputs.dirs([
        'community-probe-types', 'probe-ts',
        'probe-ts-actual', 'probe-ts-api-modules',
        'probe-ts-bean-exclusion', 'probe-ts-bean-inheritance',
        'probe-ts-bean-method-projection', 'probe-ts-capture-return-contract',
        'probe-ts-character-projection', 'probe-ts-class-bounds',
        'probe-ts-collection-input', 'probe-ts-complete-capture',
        'probe-ts-complete-capture-authored-optional', 'probe-ts-complete-capture-authored-stream',
        'probe-ts-complete-capture-edited', 'probe-ts-complete-capture-reused',
        'probe-ts-constable-values', 'probe-ts-constructor-input',
        'probe-ts-constructor-members', 'probe-ts-dependency-closure',
        'probe-ts-enum-heritage', 'probe-ts-erased-method-contract',
        'probe-ts-event-dependencies', 'probe-ts-event-imports',
        'probe-ts-field-method-selectors', 'probe-ts-generic-adapter',
        'probe-ts-global-type-simplification', 'probe-ts-i18n',
        'probe-ts-inherited-bean', 'probe-ts-inherited-interface',
        'probe-ts-interface-binding', 'probe-ts-interface-merge',
        'probe-ts-interface-overloads', 'probe-ts-interface-static',
        'probe-ts-manual-array-references', 'probe-ts-manual-references',
        'probe-ts-member-names', 'probe-ts-method-bounds',
        'probe-ts-mixed-quote-import', 'probe-ts-mixin-declarations',
        'probe-ts-mixin-hooks', 'probe-ts-native-recipe-handlers',
        'probe-ts-node-ambient-classes', 'probe-ts-node-assert',
        'probe-ts-node-callable-default', 'probe-ts-node-util-predicate',
        'probe-ts-object-projection', 'probe-ts-owner-generics',
        'probe-ts-raw-input', 'probe-ts-raw-output',
        'probe-ts-recipe-input-alias', 'probe-ts-recipe-readable',
        'probe-ts-registry-catalog', 'probe-ts-result-variance',
        'probe-ts-sam-proxy-input', 'probe-ts-same-name-heritage',
        'probe-ts-same-name-heritage-adapter', 'probe-ts-same-name-heritage-edited',
        'probe-ts-same-name-heritage-functional', 'probe-ts-same-name-heritage-getter-imports',
        'probe-ts-same-name-heritage-multiple', 'probe-ts-script-input-shapes',
        'probe-ts-script-output', 'probe-ts-static-shadowing',
        'probe-ts-stream-capture-authored', 'probe-ts-stream-capture-return',
        'probe-ts-synthetic-contract', 'probe-ts-wildcard-collection',
        'probe-ts-wildcard-optional'
    ].collect { layout.buildDirectory.dir(it) }).withPropertyName('probeTypeScriptFixtures')
    // The aggregate CI gate reads this report after test results are restored from cache.
    outputs.file(layout.buildDirectory.file('nekojs-gates/declaration-parity.json'))
        .withPropertyName('declarationParityReport')
}

// Guard the common module's MC/loader-agnostic invariant: common must not import
// Minecraft / NeoForge / Fabric / Mojang types (it is compiled on Java 21 with no MC deps
// and shared across all 5 platforms). Graal imports ARE allowed — common intentionally owns
// the GraalJS engine.
//
// 前缀表必须与另两处强制点一致（票 33 review F1：原先只有 3 个前缀、漏 net.fabricmc 与
// com.mojang，导致"只跑 :common:check"比聚合门禁弱）：
//   - stonecutter.gradle.kts 的 guardLint  L1/L2 mcLoaderImport
//   - ModulePipelineIsolationTest 的 scan() 禁止项
// 三处一致由 CommonIsolationPrefixAgreementTest 在 :common:test 里断言。
tasks.register('checkCommonIsolation') {
    group = 'verification'
    description = 'Rejects Minecraft/NeoForge/Fabric/Mojang imports in common (keeps it platform-agnostic).'

    def forbiddenPrefixes = [
        'net.minecraft',
        'net.minecraftforge',
        'net.neoforged',
        'net.fabricmc',
        'com.mojang'
    ]

    inputs.files(fileTree('src/main/java') { include '**/*.java' })

    doLast {
        def violations = []
        fileTree('src/main/java') { include '**/*.java' }.each { source ->
            source.eachLine { line, number ->
                def trimmed = line.trim()
                if (!trimmed.startsWith('import ') || !trimmed.endsWith(';')) {
                    return
                }
                def importedType = trimmed.substring('import '.length(), trimmed.length() - 1)
                if (importedType.startsWith('static ')) {
                    importedType = importedType.substring('static '.length())
                }
                if (forbiddenPrefixes.any { prefix -> importedType.startsWith(prefix + '.') }) {
                    violations << "${project.relativePath(source)}:${number}: ${line.trim()}"
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("common module MC-agnostic isolation violations:\n" + violations.join('\n'))
        }
    }
}

check.dependsOn checkCommonIsolation

compileJava {
    // Graal 的 TruffleLanguage.Registration 等是运行时反射读取，不需要注解处理器，
    // javac 的 [processing] 提示纯属噪音，单独关掉该 lint。
    options.compilerArgs += '-Xlint:-processing'
}

// 注意：api.* 的枚举与 switch 现在同模块编译。若将来又把 api.* 拆成独立制品，跨 jar 的
// $SwitchMap$ 陷阱会原样回来——javac 把 switch over enum 编译成消费方内部的合成类，而
// Gradle 的 ABI 编译回避不会注意到枚举常量重排，会留下错误分派的陈旧 $SwitchMap$。

tasks.register('nbtSmokeTest', Test) {
    group = 'verification'
    description = 'Runs managed API and sandboxed filesystem smoke tests for portable binary NBT.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'nbt-smoke'
    }
}

// Golden 再生成入口：运行 `./gradlew :common:regenerateGoldens`
tasks.register('regenerateGoldens', Test) {
    group = 'verification'
    description = 'Regenerates probe golden files from current actuals (review the diff, then commit).'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'com.tkisor.nekojs.probe.*'
    }
    systemProperty 'nekojs.golden.regenerate', 'true'
}

tasks.register('regenerateUiProfileGolden', Test) {
    group = 'verification'
    description = 'Regenerates the public UI profile layout golden (review the diff before acceptance).'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'com.tkisor.nekojs.core.module.Ticket43ProfileGoldenTest'
    }
    systemProperty 'nekojs.ui.profile.golden.regenerate', 'true'
    outputs.upToDateWhen { false }
}

// ---- Ticket 08: test-only external addon fixture artifact ----------------------------
// Mimics a future third-party plugin jar: sources live in a dedicated source set whose
// compile classpath is **only** common main output (not even this module's test deps or
// fixtures are visible — structurally guaranteeing "the dependency surface matches a
// third-party plugin and never imports production-internal test seams"). The jar carries
// production-shaped neoforge.mods.toml and fabric.mod.json; none of the five production
// node jars may contain any of it (root-level verifyExternalAddonIsolation gate).

sourceSets {
    addonFixture {
        // Default dirs are src/addonFixture/{java,resources}; only the classpath is pinned.
        // Deliberately main output only: the compile surface = public engine contracts
        // (api.* + core.plugin provider API), a subset of the published fat-jar surface
        // a third party compiles against.
        compileClasspath = sourceSets.main.output
    }
}

def externalAddonJar = tasks.register('externalAddonJar', Jar) {
    group = 'verification'
    description = 'Builds the test-only external addon fixture jar (ticket 08 discovery input).'
    archiveBaseName = 'nekojs-external-addon-fixture'
    archiveClassifier = 'testonly'
    from sourceSets.addonFixture.output
}

// Injects the fixture jar path into a consuming test task (doFirst so the JVM picks it up)
def provideAddonJarTo = { Test testTask ->
    testTask.dependsOn externalAddonJar
    testTask.inputs.files(externalAddonJar)
    testTask.doFirst {
        systemProperty 'nekojs.test.externalAddonJar',
                externalAddonJar.get().archiveFile.get().asFile.absolutePath
    }
}

provideAddonJarTo(tasks.named('test', Test).get())

// Compile-surface gate for the fixture: rejects anyone later wiring testImplementation
// into addonFixture — that would degrade the independent third-party surface into an
// internal test-seam consumer.
tasks.register('verifyAddonFixtureDependencySurface') {
    group = 'verification'
    description = 'Asserts the addon fixture source set compiles against common main output only.'
    dependsOn tasks.named('compileAddonFixtureJava')
    doLast {
        def cp = tasks.named('compileAddonFixtureJava').get().classpath.files.collect { it.canonicalPath }.toSet()
        def allowed = sourceSets.main.output.files.collect { it.canonicalPath }.toSet()
        def unexpected = cp - allowed
        if (!unexpected.isEmpty()) {
            throw new GradleException(
                    "addonFixture compile classpath must be common main output only, found: ${unexpected.sort()}")
        }
    }
}
check.dependsOn tasks.named('verifyAddonFixtureDependencySurface')

configurations {
    packToolRuntime {
        canBeConsumed = false
        canBeResolved = true
        extendsFrom compileOnly, runtimeClasspath
    }
}
dependencies { packToolRuntime libs.icu4j }

tasks.register('packTool', JavaExec) {
    group = 'nekojs'
    description = 'Creates, validates, archives, installs or builds a content mod from a versioned script pack.'
    dependsOn classes
    classpath = sourceSets.main.output + configurations.packToolRuntime
    mainClass = 'com.tkisor.nekojs.core.pack.tool.PackToolMain'
    workingDir = rootProject.projectDir
    doFirst {
        def argumentsFile = providers.gradleProperty('packArgsFile').orNull
        def json = argumentsFile == null ? providers.gradleProperty('packArgs').getOrElse('[]') : rootProject.file(argumentsFile).getText('UTF-8')
        def values = new groovy.json.JsonSlurper().parseText(json)
        if (!(values instanceof List) || values.any { !(it instanceof String) }) {
            throw new GradleException('packArgs must be a JSON string array')
        }
        args = values
    }
}


// Content identities bind the English handbook and examples to the release version.
def authoringResources = layout.projectDirectory.dir('src/main/resources/nekojs/authoring')
def authoringGenerated = layout.buildDirectory.dir('generated/authoring-resources')
def generateAuthoringManifest = tasks.register('generateAuthoringManifest') {
    inputs.dir(authoringResources)
    inputs.property('modVersion', mod_version)
    outputs.dir(authoringGenerated)
    doLast {
        def digest = { byte[] bytes -> java.security.MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString() }
        def entries = fileTree(authoringResources).files.sort { a, b -> a.path <=> b.path }.collect { source ->
            [path: authoringResources.asFile.toPath().relativize(source.toPath()).toString().replace('\\', '/'), sha256: digest(source.bytes)]
        }
        def identity = groovy.json.JsonOutput.toJson([version: mod_version, files: entries])
        def manifest = [schemaVersion: '1', version: mod_version, language: 'en', bundleId: digest(identity.getBytes('UTF-8')), files: entries]
        def output = authoringGenerated.get().file('nekojs/authoring/manifest.json').asFile
        output.parentFile.mkdirs()
        output.setText(groovy.json.JsonOutput.toJson(manifest) + '\n', 'UTF-8')
    }
}
sourceSets.main.resources.srcDir(authoringGenerated)
tasks.named('processResources') { dependsOn generateAuthoringManifest }

// The companion contains the read-only query stack, documents, Gson and the shared TOML parser.
configurations { authoringStdioRuntime }
dependencies {
    authoringStdioRuntime libs.gson
    authoringStdioRuntime libs.night.config.core
    authoringStdioRuntime libs.night.config.toml
}
def authoringStdioJar = tasks.register('authoringStdioJar', Jar) {
    group = 'build'
    description = 'Builds the standalone read-only MCP stdio companion (Java 21+).'
    archiveClassifier = 'authoring-stdio'
    dependsOn classes
    manifest { attributes 'Main-Class': 'com.tkisor.nekojs.authoring.AuthoringStdioMain', 'Multi-Release': 'true' }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(sourceSets.main.output) {
        include 'com/tkisor/nekojs/authoring/**'
        include 'nekojs/authoring/**'
        exclude 'com/tkisor/nekojs/authoring/AuthoringRuntime*'
        exclude 'com/tkisor/nekojs/authoring/AuthoringHttpServer*'
        exclude 'com/tkisor/nekojs/authoring/AuthoringConfig*'
        exclude 'com/tkisor/nekojs/authoring/AuthoringControl*'
        exclude 'com/tkisor/nekojs/authoring/AuthoringClientExecutor*'
        exclude 'com/tkisor/nekojs/authoring/AuthoringEnvironment*'
        exclude 'com/tkisor/nekojs/authoring/AuthoringBundleExporter*'
    }
    from({ configurations.authoringStdioRuntime.collect { zipTree(it) } }) {
        exclude 'module-info.class', 'META-INF/versions/**/module-info.class'
        exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'META-INF/MANIFEST.MF'
    }
    from('src/authoring-stdio/resources')
}
tasks.named('assemble') { dependsOn authoringStdioJar }
// Process tests launch exactly this artifact, never the mod/test runtime classpath.
tasks.named('test') {
    dependsOn authoringStdioJar
    doFirst { systemProperty 'nekojs.authoring.stdio.jar', authoringStdioJar.get().archiveFile.get().asFile.absolutePath }
}

