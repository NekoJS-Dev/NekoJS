plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'com.gradleup.shadow' version '9.4.1'
    id 'xyz.wagyourtail.unimined' version '1.4.23-kappa'
    id 'net.kyori.blossom' version '2.2.0'
}

ext {
    //noinspection GroovyAssignabilityCheck
    access_transformer_locations = "${mod_id}_at.cfg"
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    if (generate_sources_jar.toBoolean()) {
        withSourcesJar()
    }
    if (generate_javadocs_jar.toBoolean()) {
        withJavadocJar()
    }
}

configurations {
    contain
    implementation.extendsFrom(contain)
    modCompileOnly
    compileOnly.extendsFrom(modCompileOnly)
    modRuntimeOnly
    runtimeOnly.extendsFrom(modRuntimeOnly)
}

def remapTaskName = enable_shadow.toBoolean() ? "remapShadowJar" : "remapJar"
def embeddedCommonRuntime = project(':common').configurations.runtimeClasspath


repositories {
    // Other repositories described by default:
    // CleanroomMC: https://maven.cleanroommc.com
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
    }
    maven {
        name = 'CleanroomCurseMaven'
        url = 'https://curse.cleanroommc.com'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    mavenCentral()
    mavenLocal() // Must be last for caching to work
}

dependencies {
    // Cleanroom / Mixin
    compileOnly "com.cleanroommc:sponge-mixin:0.20.13+mixin.0.8.7"
    if (enable_lwjglx.toBoolean()) {
        compileOnly "com.cleanroommc:lwjglx:1.0.0"
    }

    // ie
    modRuntimeOnly("curse.maven:immersive-engineering-231951:2974106")

    // hei — compileOnly (JeiProxyAccessor mixin + typed HeiRefresher) + runtime (the mod itself)
    modCompileOnly("curse.maven:had-enough-items-557549:8081514")
    modRuntimeOnly("curse.maven:had-enough-items-557549:8081514")

    // NekoJS common module
    implementation project(':common')

    // GraalJS (bundled in jar)
    contain("curse.maven:graal-1504336:8456810")

    // Common compileOnly dependencies (needed at compile time for common module classes)
    compileOnly 'org.jspecify:jspecify:1.0.0'
    compileOnly 'org.slf4j:slf4j-api:1.7.36'
    compileOnly 'org.jetbrains:annotations:24.1.0'

    // Runtime dependencies (bundled in jar)
    contain 'com.electronwill.night-config:core:3.8.3'
    contain 'com.electronwill.night-config:toml:3.8.3'
    // Note: Gson/Log4j/Guava are bundled with Minecraft 1.12.2, no need to bundle
    compileOnly 'org.projectlombok:lombok:1.18.44'
    annotationProcessor 'org.projectlombok:lombok:1.18.44'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}


//noinspection GroovyAssignabilityCheck
unimined.minecraft {
    version "1.12.2"

    mappings {
        mcp("stable", "39-1.12")
    }

    cleanroom {
        accessTransformer "${rootProject.projectDir}/platforms/cleanroom-1.12.2/src/main/resources/$access_transformer_locations"

        loader "0.5.14-alpha"
        runs.all {
            systemProperty("crl.dev.mixin", "${mod_id}.default.mixin.json,${mod_id}.mod.mixin.json")
            args += ['--username', minecraft_username]
            return
        }
    }

    defaultRemapJar = false

    String jarTaskName = enable_shadow.toBoolean() ? "shadowJar" : "jar"

    remap(tasks.named(jarTaskName).get()) {
        mixinRemap {
            enableBaseMixin()
            enableMixinExtra()
        }
    }

    mods {
        remap(configurations.modCompileOnly)
        remap(configurations.modRuntimeOnly)
    }
}

processResources {
    rename '(.+_at.cfg)', 'META-INF/$1'
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
        blossom {
            javaSources {
                property('mod_id', mod_id)
                property('mod_name', mod_name)
                property('mod_version', mod_version)
                property('package', "${mod_group_id}.${mod_id}")
            }
            resources {
                property('mod_id', mod_id)
                property('mod_name', mod_name)
                property('mod_version', mod_version)
                property('mod_description', mod_description)
                property('mod_authors', mod_authors.toString().split(',').findAll { !it.isBlank() }.collect { "\"${it.strip()}\"" }.join(', '))
            }
        }
    }
}

idea {
    module {
        inheritOutputDirs = true
    }
}

if (!enable_shadow.toBoolean()) {
    shadowJar.enabled = false
}

compileJava {
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_25
}

jar {
    dependsOn project(':common').tasks.named('jar')
    dependsOn project(':common-api').tasks.named('jar')
    archiveClassifier = 'dev'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from project(':common').sourceSets.main.output
    from project(':common-api').sourceSets.main.output
    from {
        embeddedCommonRuntime.collect { dependency ->
            dependency.isDirectory() ? dependency : zipTree(dependency)
        }
    }
    // Extract all contained deps directly into the jar so classes are available
    // at runtime without relying on Cleanroom's ContainedDeps scanning
    if (configurations.contain.size() > 0) {
        from {
            configurations.contain.collect {
                it.isDirectory() ? it : zipTree(it)
            }
        }
    }
    doFirst {
        manifest {
            def attribute_map = [:]
            attribute_map['ModType'] = "CRL"
            attribute_map['MixinConfigs'] = "${mod_id}.default.mixin.json,${mod_id}.mod.mixin.json"
            if (configurations.contain.size() > 0) {
                attribute_map['ContainedDeps'] = configurations.contain.collect { it.name }.join(' ')
                attribute_map['NonModDeps'] = true
            }
            if (use_access_transformer.toBoolean()) {
                attribute_map['FMLAT'] = access_transformer_locations
            }
            attributes(attribute_map)
        }
    }
    finalizedBy(tasks.named(remapTaskName).get())
}


shadowJar {
    //noinspection GroovyAssignabilityCheck,GroovyAccessibility
    configurations = [project.configurations.shadow]
    archiveClassifier = "shadow"
}

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

def verifyRuntimeArtifact = tasks.register('verifyRuntimeArtifact') {
    group = 'verification'
    description = 'Verifies that the remapped distributable jar contains runtime and common API classes.'
    dependsOn tasks.named(remapTaskName)

    doLast {
        def candidates = tasks.named(remapTaskName).get().outputs.files.files.findAll {
            it.isFile() && it.name.endsWith('.jar')
        }
        if (candidates.size() != 1) {
            throw new GradleException("Expected one Cleanroom remap output jar, found: ${candidates*.name}")
        }
        def artifact = candidates.first()
        def requiredEntries = ([
            'com/tkisor/nekojs/core/NekoCoreContext.class',
            'com/tkisor/nekojs/core/api/CoreManagedApiBootstrap.class',
            'com/tkisor/nekojs/core/api/ApiFacadeProxy.class',
            'com/tkisor/nekojs/core/api/ApiValueMarshaller.class',
            'com/tkisor/nekojs/core/api/ApiGuestErrorFactory.class',
            'com/tkisor/nekojs/api/surface/ApiVersion.class',
            'com/tkisor/nekojs/api/data/NekoId.class',
            'com/tkisor/nekojs/api/data/TextValue.class',
            'com/tkisor/nekojs/api/data/TextArgument.class',
            'com/tkisor/nekojs/api/data/JsNumber.class',
            'com/tkisor/nekojs/api/data/JsonValue.class',
            'com/tkisor/nekojs/api/data/NbtValue.class',
            'com/tkisor/nekojs/api/data/NbtEntry.class',
            'com/tkisor/nekojs/api/nbt/NbtBinaryCodec.class',
            'com/tkisor/nekojs/api/nbt/NbtBinaryException.class',
            'com/tkisor/nekojs/api/nbt/NbtBinaryLimits.class',
            'com/tkisor/nekojs/api/facade/JsonFacade.class',
            'com/tkisor/nekojs/api/facade/NbtFacade.class',
            'com/tkisor/nekojs/api/facade/IdFacade.class',
            'com/tkisor/nekojs/api/facade/PlatformFacade.class',
            'com/tkisor/nekojs/core/api/facade/DefaultIdFacade.class',
            'com/tkisor/nekojs/core/api/facade/DefaultPlatformFacade.class',
            'com/tkisor/nekojs/core/api/facade/DefaultTextFacade.class',
            'com/tkisor/nekojs/core/api/facade/DefaultJsonFacade.class',
            'com/tkisor/nekojs/core/api/facade/DefaultNbtFacade.class',
            'com/tkisor/nekojs/core/api/nbt/NbtSnbtSerializer.class',
            'com/tkisor/nekojs/core/api/nbt/NbtFileStore.class',
            'com/tkisor/nekojs/platform/nbt/CleanroomNbtBinaryCodec.class',
            'com/tkisor/nekojs/core/api/json/JsonValueParser.class',
            'com/tkisor/nekojs/core/api/json/JsonValueSerializer.class',
            'com/tkisor/nekojs/core/api/json/JsonValueException.class',
            'nekojs/api-contract/api-contract.schema.json',
            'nekojs/api-contract/portable-core-0.10.0.json',
            'nekojs/api-runtime.properties'
        ] as Set)
        [project(':common'), project(':common-api')].each { runtimeProject ->
            runtimeProject.sourceSets.main.output.files
                    .findAll { output -> output.isDirectory() }
                    .each { output ->
                        fileTree(output).files.each { runtimeFile ->
                            requiredEntries.add(output.toPath().relativize(runtimeFile.toPath())
                                    .toString().replace('\\', '/'))
                        }
                    }
        }
        embeddedCommonRuntime.each { dependency ->
            if (dependency.isDirectory()) {
                fileTree(dependency).files.findAll { file -> file.name.endsWith('.class') }.each { file ->
                    requiredEntries.add(dependency.toPath().relativize(file.toPath()).toString().replace('\\', '/'))
                }
            } else {
                def dependencyArchive = new java.util.zip.ZipFile(dependency)
                try {
                    dependencyArchive.entries().each { entry ->
                        if (!entry.directory && entry.name.endsWith('.class') && !entry.name.endsWith('module-info.class')) {
                            requiredEntries.add(entry.name)
                        }
                    }
                } finally {
                    dependencyArchive.close()
                }
            }
        }
        def archive = new java.util.zip.ZipFile(artifact)
        try {
            def entries = archive.entries().collect { it.name } as Set
            def missing = requiredEntries.findAll { entry -> !entries.contains(entry) }
            if (!missing.isEmpty()) {
                throw new GradleException("Runtime artifact ${artifact.name} is missing: ${missing.join(', ')}")
            }
        } finally {
            archive.close()
        }
    }
}

tasks.named('check').configure {
    dependsOn verifyRuntimeArtifact
}


tasks.named(remapTaskName).configure {
    doFirst {
        logging.captureStandardOutput LogLevel.INFO
    }
    doLast {
        logging.captureStandardOutput LogLevel.QUIET
    }
}

compileTestJava {
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_25
}

test {
    useJUnitPlatform()
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    })
    testLogging {
        showStandardStreams = true
    }

}

tasks.register('nbtSmokeTest', Test) {
    group = 'verification'
    description = 'Runs the native Cleanroom portable binary NBT smoke tests.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'nbt-smoke'
    }
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    })
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
