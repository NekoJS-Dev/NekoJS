plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    alias(libs.plugins.moddev)
    alias(libs.plugins.unified.publishing)
}

version = mod_version
group = mod_group_id

// minecraft_version / ENV 通过 ext 暴露给 gradle/neoforge-common.gradle
ext.minecraft_version = "26.2.0"
ext.ENV = System.getenv()
def neo_version = "26.2.0.7-beta"
def minecraft_version_range= "[26.2.0,26.3)"
def neo_version_range= "[26,)"
def loader_version_range= "[4,)"

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets {
    main {
        java {
            srcDir '../neoforge-26-shared/src/main/java'
        }
        resources {
            srcDir '../neoforge-26-shared/src/main/resources'
            srcDir 'src/generated/resources'
        }
    }
    test.java.srcDir '../neoforge-26-shared/src/test/java'
}
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

test {
    useJUnitPlatform()
}

// base.archivesName / repositories / tasks.withType(Jar) / publishing / unifiedPublishing / idea
// 由 gradle/neoforge-common.gradle 统一配置（三平台字节级相同的部分）
apply from: rootProject.file('gradle/neoforge-common.gradle')

neoForge {
    version = neo_version

    accessTransformers = project.files('../neoforge-26-shared/src/main/resources/META-INF/accesstransformer.cfg')

    interfaceInjectionData {
        it.from(project.files('../neoforge-26-shared/src/main/resources/nekojs.interface_injection.json'))
    }

    runs {
        client {
            client()
            jvmArguments.add('-Dfml.earlydisplay=false')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    implementation project(':common')
    // 30.1.0.12 for NeoForge 26.2
    implementation "curse.maven:jei-238222:8300448"

    compileOnly libs.lombok
    annotationProcessor libs.lombok
    annotationProcessor project(':common-api-processor')
    annotationProcessor project(':common-api')

    // JUnit deliberately pinned to 5.x locally (common-api/common use the 6.0.0 BOM).
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.3'
    testRuntimeOnly libs.junit.platform.launcher
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "../neoforge-26-shared/src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
