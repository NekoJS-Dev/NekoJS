plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    alias(libs.plugins.moddev)
    alias(libs.plugins.unified.publishing)
}

version = mod_version
group = mod_group_id

// minecraft_version / ENV 通过 ext 暴露给 gradle/neoforge-common.gradle
ext.minecraft_version = "1.21.1"
ext.ENV = System.getenv()
def neo_version = "21.1.227"
def minecraft_version_range= "[1.21,1.22)"
def neo_version_range= "[21.1,22.0)"
def loader_version_range= "[4,)"

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    main {
        java {
            // 与 26.x 共享的版本无关源码树（52 个字节级相同文件，见 git 历史）
            srcDirs = ['src/main/java', '../neoforge-shared/src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources', 'src/generated/resources']
        }
    }
    // 只挂三平台共享的测试层。不能挂 ../neoforge-26-shared/src/test/java：本平台的 main 也不
    // 包含 neoforge-26-shared/src/main/java，那一层里的 26.x-only 测试（DynamicRegistry 等）
    // 在这里根本没有被测类。
    test.java.srcDir '../neoforge-shared/src/test/java'
}

// base.archivesName / repositories / tasks.withType(Jar) / publishing / unifiedPublishing / idea
// 由 gradle/neoforge-common.gradle 统一配置（三平台字节级相同的部分）
// 开发运行需要 :common / :common-api 类可见（mixin 注入的扩展接口引用 Spec 类），
// 与 26.x 一致地注册为 ModDev mod source set 并启用 verifyDevModSourceSets 门禁。
ext.register_shared_dev_mod_source_sets = true
apply from: rootProject.file('gradle/neoforge-common.gradle')

neoForge {
    version = neo_version

    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

//    interfaceInjectionData {
//        it.from(project.files('src/main/resources/nekojs.interface_injection.json'))
//    }

    runs {
        client {
            client()
            jvmArguments.add('-Dfml.earlydisplay=false')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(project(':common').sourceSets.main)
            sourceSet(project(':common-api').sourceSets.main)
        }
    }
}

dependencies {
    implementation project(':common')
    implementation "curse.maven:jei-238222:7420587"

    // dev runServer 的 GraalJS 需要 ICU4J：client run 经 common→GraalMC(curse.maven) 的传递
    // 依赖拿到 icu4j 77.1，但 MDG 的 server legacy classpath 不收项目 runtimeClasspath 的
    // 传递库（NoClassDefFoundError: com/ibm/icu/text/DateFormat）。additionalRuntimeClasspath
    // 是 MDG 为「补进所有 run 运行时」提供的配置；server 侧受 MC 依赖树 strictly 73.2
    // 约束（GraalJS 所需的 com.ibm.icu.text.DateFormat 73.2 同样提供），不进分发 jar。
    additionalRuntimeClasspath 'com.ibm.icu:icu4j:73.2'

    compileOnly libs.lombok
    annotationProcessor libs.lombok
    annotationProcessor project(':common-api-processor')
    annotationProcessor project(':common-api')

    compileOnly libs.jspecify

    // JUnit deliberately pinned to 5.x locally (common-api/common use the 6.0.0 BOM);
    // platform test classpath stays on JUnit 5 during the migration.
    testImplementation libs.junit.jupiter.legacy
    testRuntimeOnly libs.junit.platform.launcher
}
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

test {
    useJUnitPlatform()
}

compileJava {
    // SpecCoverageProcessor 平台范围校验：本平台属于 NeoForge 系列
    options.compilerArgs += '-Anekojs.platform=nf'

    // 根配置开了 -Xlint:all；Forge/NeoForge/Mixin 注解是运行时元数据，不需要注解处理器，
    // javac 的 [processing] 提示纯属噪音，这里单独关掉该 lint（与 cleanroom 平台一致）。
    options.compilerArgs += '-Xlint:-processing'
}

def generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
